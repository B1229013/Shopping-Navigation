<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1010" viewBox="0 0 1620 1010" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e5bd7"/></marker>
    <marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2a6c"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
  </defs>

  <rect width="1620" height="1010" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="810" y="64" text-anchor="middle" font-size="40" font-weight="700" fill="#1b1b1b">智慧購物導航 — 系統架構</text>

  <!-- 圖例 -->
  <g font-size="14" fill="#333">
    <rect x="30" y="108" width="350" height="168" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
    <text x="48" y="134" font-weight="700" font-size="15">圖例</text>
    <rect x="48" y="146" width="26" height="12" rx="3" fill="#2e7d32"/><text x="84" y="157">手機 App（Android／iOS）</text>
    <rect x="48" y="168" width="26" height="12" rx="3" fill="#1e5bd7"/><text x="84" y="179">雲端 AI／OCR 服務（App 直接呼叫）</text>
    <rect x="48" y="190" width="26" height="12" rx="3" fill="#1a2a6c"/><text x="84" y="201">導航後端（每張照片的處理流程）</text>
    <rect x="48" y="212" width="26" height="12" rx="3" fill="#e8711a"/><text x="84" y="223">決策／輸出</text>
    <rect x="48" y="234" width="26" height="12" rx="3" fill="#6b4fa0"/><text x="84" y="245">店家地圖資料</text>
    <line x1="48" y1="262" x2="72" y2="262" stroke="#555" stroke-width="2" marker-end="url(#a-navy)"/><text x="84" y="267">資料流向</text>
  </g>

  <!-- 使用者 -->
  <rect x="30" y="540" width="100" height="100" rx="10" fill="#f1f8f1" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="80" cy="572" r="11" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <path d="M60,604 a20,16 0 0 1 40,0" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="80" y="628" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4f22">使用者</text>
  <line x1="130" y1="590" x2="163" y2="590" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-green)"/>

  <!-- Firebase -->
  <rect x="165" y="330" width="200" height="90" rx="10" fill="#f1f8f1" stroke="#2e7d32" stroke-width="2"/>
  <text x="265" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4f22">Firebase 身分驗證</text>
  <text x="265" y="394" text-anchor="middle" font-size="13.5" fill="#333">Email／密碼登入</text>
  <line x1="265" y1="420" x2="265" y2="468" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-green)"/>

  <!-- 手機 App -->
  <rect x="165" y="470" width="200" height="260" rx="18" fill="#f1f8f1" stroke="#2e7d32" stroke-width="3"/>
  <text x="265" y="505" text-anchor="middle" font-size="20" font-weight="700" fill="#1f4f22">手機 App（前端）</text>
  <text x="265" y="535" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f4f22">Android</text>
  <text x="265" y="553" text-anchor="middle" font-size="12.5" fill="#333">Kotlin · Jetpack Compose</text>
  <text x="265" y="578" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f4f22">iOS</text>
  <text x="265" y="596" text-anchor="middle" font-size="12.5" fill="#333">SwiftUI</text>
  <line x1="185" y1="612" x2="345" y2="612" stroke="#9cc59e" stroke-width="1"/>
  <text x="265" y="636" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f4f22">PDR 即時位置</text>
  <text x="265" y="657" text-anchor="middle" font-size="12.5" fill="#333">兩張照片之間用計步＋航向</text>
  <text x="265" y="676" text-anchor="middle" font-size="12.5" fill="#333">沿路線前進、畫小地圖</text>
  <text x="265" y="695" text-anchor="middle" font-size="12.5" fill="#333">走偏時重新規劃</text>

  <!-- 手機 → AI 購物助理 -->
  <polyline points="365,495 395,495 395,290 418,290" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-green)"/>

  <!-- AI 購物助理 -->
  <rect x="420" y="105" width="1170" height="350" rx="16" fill="#f5f8ff" stroke="#1e5bd7" stroke-width="2.5"/>
  <text x="1005" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#1e5bd7">AI 購物助理（App 直接呼叫雲端服務）</text>

  <g font-size="13.5" fill="#333">
    <!-- 第 1 列：收據 -->
    <rect x="445" y="172" width="170" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="530" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#16367a">收據掃描</text>
    <text x="675" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16367a">收據照片</text>
    <line x1="615" y1="210" x2="733" y2="210" stroke="#1e5bd7" stroke-width="2.2" marker-end="url(#a-blue)"/>
    <rect x="735" y="172" width="400" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="755" y="196" font-size="15.5" font-weight="700" fill="#16367a">文字辨識</text>
    <text x="755" y="218">Android：視覺 LLM gpt-5.6-luna（CGU gateway）</text>
    <text x="755" y="238">iOS：PaddleOCR（有設定時）或 Apple Vision</text>
    <line x1="1135" y1="210" x2="1183" y2="210" stroke="#1e5bd7" stroke-width="2.2" marker-end="url(#a-blue)"/>
    <rect x="1185" y="172" width="380" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="1205" y="196" font-size="15.5" font-weight="700" fill="#16367a">LLM 整理成記帳項目</text>
    <text x="1205" y="218">Android：gpt-5.6-luna（CGU gateway）</text>
    <text x="1205" y="238">iOS：gpt-5.4-mini（OpenAI）</text>

    <!-- 第 2 列：成分 -->
    <rect x="445" y="262" width="170" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="530" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#16367a">成分掃描</text>
    <text x="675" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16367a">成分照片</text>
    <line x1="615" y1="300" x2="733" y2="300" stroke="#1e5bd7" stroke-width="2.2" marker-end="url(#a-blue)"/>
    <rect x="735" y="262" width="400" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="755" y="286" font-size="15.5" font-weight="700" fill="#16367a">文字辨識</text>
    <text x="755" y="308">Android：視覺 LLM gpt-5.6-luna（CGU gateway）</text>
    <text x="755" y="328">iOS：Apple Vision（在手機上）</text>
    <line x1="1135" y1="300" x2="1183" y2="300" stroke="#1e5bd7" stroke-width="2.2" marker-end="url(#a-blue)"/>
    <rect x="1185" y="262" width="380" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="1205" y="286" font-size="15.5" font-weight="700" fill="#16367a">自動偵測過敏原</text>
    <text x="1205" y="308">依使用者設定的過敏原比對成分表</text>

    <!-- 第 3 列：AI 助理 -->
    <rect x="445" y="352" width="170" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="530" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#16367a">AI 助理</text>
    <text x="675" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#16367a">問題＋</text>
    <text x="675" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#16367a">購物情境 JSON</text>
    <line x1="615" y1="400" x2="733" y2="400" stroke="#1e5bd7" stroke-width="2.2" marker-end="url(#a-blue)"/>
    <rect x="735" y="352" width="400" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="755" y="376" font-size="15.5" font-weight="700" fill="#16367a">LLM 對話</text>
    <text x="755" y="398">Android：gpt-5.6-luna（CGU gateway）</text>
    <text x="755" y="418">iOS：gpt-5.4-mini（OpenAI）</text>
    <line x1="1135" y1="390" x2="1183" y2="390" stroke="#1e5bd7" stroke-width="2.2" marker-end="url(#a-blue)"/>
    <rect x="1185" y="352" width="380" height="76" rx="10" fill="#fff" stroke="#1e5bd7" stroke-width="1.8"/>
    <text x="1205" y="376" font-size="15.5" font-weight="700" fill="#16367a">情境感知回覆</text>
    <text x="1205" y="398">參考購物清單、預算與健康資料回答</text>
  </g>

  <!-- 手機 → 導航後端 -->

  <!-- 導航後端 -->
  <rect x="470" y="490" width="1090" height="440" rx="16" fill="#f7f8fc" stroke="#1a2a6c" stroke-width="2.5"/>
  <text x="1015" y="530" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2a6c">實場視覺導航後端（Python · FastAPI）</text>
  <rect x="725" y="545" width="580" height="32" rx="8" fill="#fff" stroke="#1a2a6c" stroke-dasharray="5 4"/>
  <text x="1015" y="567" text-anchor="middle" font-size="15" fill="#1a2a6c">每張照片：品質檢查 → VLM 感知 → 定位融合 → 路線規劃 → 決策</text>

  <line x1="365" y1="700" x2="493" y2="700" stroke="#1a2a6c" stroke-width="2.5" marker-end="url(#a-navy)"/>
  <text x="416" y="655" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a2a6c">照片</text>
  <text x="416" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2a6c">＋PDR 位置</text>
  <text x="416" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2a6c">＋航向</text>

  <g font-size="13.5" fill="#333" text-anchor="middle">
    <!-- 1 品質 -->
    <rect x="495" y="600" width="186" height="205" rx="12" fill="#fff" stroke="#1a2a6c" stroke-width="2"/>
    <circle cx="588" cy="600" r="15" fill="#1a2a6c"/><text x="588" y="606" fill="#fff" font-size="15" font-weight="700">1</text>
    <text x="588" y="648" font-size="17" font-weight="700" fill="#1a2a6c">照片品質檢查</text>
    <text x="588" y="680">模糊、太暗、遮擋</text>
    <text x="588" y="702">→ 請使用者重拍</text>
    <text x="588" y="736" fill="#666" font-size="12.5">iOS 另外檢查</text>
    <text x="588" y="756" fill="#666" font-size="12.5">手機有沒有拿直</text>
    <line x1="681" y1="700" x2="709" y2="700" stroke="#1a2a6c" stroke-width="2.2" marker-end="url(#a-navy)"/>

    <!-- 2 感知 -->
    <rect x="711" y="600" width="186" height="205" rx="12" fill="#fff" stroke="#1a2a6c" stroke-width="2"/>
    <circle cx="804" cy="600" r="15" fill="#1a2a6c"/><text x="804" y="606" fill="#fff" font-size="15" font-weight="700">2</text>
    <text x="804" y="648" font-size="17" font-weight="700" fill="#1a2a6c">VLM 感知</text>
    <text x="804" y="680" font-weight="700" fill="#1e5bd7">gpt-5.4-mini</text>
    <text x="804" y="700" font-size="12.5">OpenAI 相容 API</text>
    <text x="804" y="718" font-size="12.5">（可走 CGU gateway）</text>
    <text x="804" y="750">讀出物件、商品名、</text>
    <text x="804" y="770">招牌文字、店內區域</text>
    <line x1="897" y1="700" x2="925" y2="700" stroke="#1a2a6c" stroke-width="2.2" marker-end="url(#a-navy)"/>

    <!-- 3 定位 -->
    <rect x="927" y="600" width="186" height="205" rx="12" fill="#fff" stroke="#1a2a6c" stroke-width="2"/>
    <circle cx="1020" cy="600" r="15" fill="#1a2a6c"/><text x="1020" y="606" fill="#fff" font-size="15" font-weight="700">3</text>
    <text x="1020" y="648" font-size="17" font-weight="700" fill="#1a2a6c">定位融合</text>
    <text x="1020" y="680">DINOv2 ＋ 物件 ＋ OCR</text>
    <text x="1020" y="700" font-size="12.5">（1 : 0.1 : 0.3）</text>
    <text x="1020" y="722">＋ 走道吊牌</text>
    <text x="1020" y="742">＋ 手機 PDR 位置</text>
    <text x="1020" y="772" font-weight="700" fill="#1a2a6c">→ 在哪個節點、面向哪裡</text>
    <line x1="1113" y1="700" x2="1141" y2="700" stroke="#1a2a6c" stroke-width="2.2" marker-end="url(#a-navy)"/>

    <!-- 4 路線 -->
    <rect x="1143" y="600" width="186" height="205" rx="12" fill="#fff" stroke="#1a2a6c" stroke-width="2"/>
    <circle cx="1236" cy="600" r="15" fill="#1a2a6c"/><text x="1236" y="606" fill="#fff" font-size="15" font-weight="700">4</text>
    <text x="1236" y="648" font-size="17" font-weight="700" fill="#1a2a6c">路線規劃</text>
    <text x="1236" y="680">Neo4j 走道拓樸圖</text>
    <text x="1236" y="702">A* 最短路線</text>
    <text x="1236" y="724">Held-Karp 排出</text>
    <text x="1236" y="744">多商品拜訪順序</text>
    <text x="1236" y="772" font-weight="700" fill="#1a2a6c">→ 收銀台 → 出口</text>
    <line x1="1329" y1="700" x2="1357" y2="700" stroke="#1a2a6c" stroke-width="2.2" marker-end="url(#a-navy)"/>

    <!-- 5 決策 -->
    <rect x="1359" y="600" width="186" height="205" rx="12" fill="#fff7ef" stroke="#e8711a" stroke-width="2.5"/>
    <circle cx="1452" cy="600" r="15" fill="#e8711a"/><text x="1452" y="606" fill="#fff" font-size="15" font-weight="700">5</text>
    <text x="1452" y="648" font-size="17" font-weight="700" fill="#c45a0c">VLM 決策</text>
    <text x="1452" y="678" font-size="12.5">依照片＋路線決定</text>
    <text x="1452" y="704" font-weight="700" fill="#c45a0c">MOVE 前進</text>
    <text x="1452" y="726" font-weight="700" fill="#c45a0c">ASK 提問</text>
    <text x="1452" y="748" font-weight="700" fill="#c45a0c">ARRIVED 抵達</text>
    <text x="1452" y="776">＋ 中文逐步指引</text>
  </g>

  <!-- 店家地圖 -->
  <rect x="495" y="830" width="834" height="78" rx="10" fill="#f6f2fc" stroke="#6b4fa0" stroke-width="2"/>
  <text x="515" y="858" font-size="15.5" font-weight="700" fill="#4b3480">店家地圖（Neo4j Aura）</text>
  <text x="515" y="884" font-size="13.5" fill="#333">Waypoint · DirPhoto（四方向照片＋DINOv2 向量）· Object · WALKWAY · ADJACENT</text>
  <text x="1310" y="884" text-anchor="end" font-size="13.5" fill="#333">＋ dino_sidecar.pkl</text>
  <line x1="1020" y1="830" x2="1020" y2="808" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a-purple)"/>
  <line x1="1236" y1="830" x2="1236" y2="808" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a-purple)"/>

  <!-- 新店建圖 -->
  <rect x="1359" y="830" width="186" height="78" rx="10" fill="#fff" stroke="#6b4fa0" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1452" y="854" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4b3480">新店建圖</text>
  <text x="1452" y="875" text-anchor="middle" font-size="12.5" fill="#333">Sensor Lab 走一圈拍照</text>
  <text x="1452" y="894" text-anchor="middle" font-size="12.5" fill="#333">→ 建圖頁確認 → 上傳</text>
  <line x1="1359" y1="869" x2="1331" y2="869" stroke="#6b4fa0" stroke-width="2" marker-end="url(#a-purple)"/>

  <!-- 導航結果 → 手機 -->
  <polyline points="1545,700 1590,700 1590,965 265,965 265,733" fill="none" stroke="#1a2a6c" stroke-width="2.5" marker-end="url(#a-navy)"/>
  <rect x="770" y="946" width="340" height="38" rx="19" fill="#1a2a6c"/>
  <text x="940" y="971" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">導航結果：指引文字、路線、小地圖</text>
</svg>
