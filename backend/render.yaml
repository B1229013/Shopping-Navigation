services:
  - type: web
    name: shopping-nav-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PERCEPTION_ENABLED
        value: "0"
      - key: OCR_ENABLED
        value: "0"
      - key: VLM_BACKEND
        value: openai
      - key: CGU_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
